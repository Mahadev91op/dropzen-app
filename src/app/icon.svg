<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dropzenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <!-- Monogram D Gradient -->
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Bolt / Accent Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#dropzenBg)" />

  <!-- Subtle Inner Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" />

  <!-- Database Grid Dots in Background -->
  <g opacity="0.18">
    <circle cx="16" cy="16" r="1.5" fill="#ffffff" />
    <circle cx="24" cy="16" r="1.5" fill="#ffffff" />
    <circle cx="32" cy="16" r="1.5" fill="#ffffff" />
    <circle cx="40" cy="16" r="1.5" fill="#ffffff" />
    <circle cx="48" cy="16" r="1.5" fill="#ffffff" />
    
    <circle cx="16" cy="48" r="1.5" fill="#ffffff" />
    <circle cx="24" cy="48" r="1.5" fill="#ffffff" />
    <circle cx="32" cy="48" r="1.5" fill="#ffffff" />
    <circle cx="40" cy="48" r="1.5" fill="#ffffff" />
    <circle cx="48" cy="48" r="1.5" fill="#ffffff" />
  </g>

  <!-- Stylized Dropzen 'D' Monogram with Growth/Lead Curve -->
  <g filter="url(#softGlow)">
    <!-- Vertical Spine of 'D' -->
    <rect x="15" y="14" width="7" height="36" rx="3.5" fill="url(#monogramGrad)" />

    <!-- Curved Loop of 'D' -->
    <path d="M19 14 H32 C42 14, 49 21, 49 32 C49 43, 42 50, 32 50 H19" fill="none" stroke="url(#monogramGrad)" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Integrated Growth / Verified Check Spark -->
    <path d="M28 32 L33 37 L44 24" fill="none" stroke="url(#boltGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Live Pulse Dot (Top Right) -->
  <circle cx="49" cy="15" r="3.5" fill="#34d399" />
  <circle cx="49" cy="15" r="5" fill="none" stroke="#34d399" stroke-width="1" opacity="0.6" />
</svg>
